<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Seasonal ids</title>
        <style>
            #Olaf {
                background-color:darkcyan
            }
            
            h2 {
                color:burlywood
            }
            #summer {
                background-color: darkgoldenrod;
            }

            #winter {
                background-color:blue
            }
            
            #Olaf-Snow {
                background-color: aquamarine;
            }

            #Olaf-Sun {
                background-color:rgb(191, 228, 228);
            }
            
        </style>
    </head>
    <body>
        
        <h1 id="Olaf">Olaf's favorite seasons</h1>
        
        <h2 id="summer">Summer</h2>
        <p id="Olaf-Snow">He's a happy snowman, doing what frozen things do in summer.</p>
        
        <h2 id="winter">Winter</h2>
        <p id="Olaf-Sun">He likes to stay in and cuddle</p>
    </body>
</html>
